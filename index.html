<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.18/index.min.css">
<style>
  * { font-family: 'Cairo', sans-serif; }
  body { background: #0f172a; }
  .sidebar-item.active { background: linear-gradient(90deg, #d4af37, #b8941f); color: #0f172a; font-weight: 700; }
  .sidebar-item:hover:not(.active) { background: rgba(212, 175, 55, 0.15); }
  .card-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
  .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%); }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: #1e293b; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }
  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  input, select, textarea { color: #e2e8f0 !important; }
  input::placeholder { color: #64748b !important; }
  .product-card { transition: all 0.3s; }
  .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2); }
  .cashier-item { transition: all 0.2s; }
  .cashier-item:hover { background: rgba(212, 175, 55, 0.1); }
  .login-bg {
    background: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .slide-in { animation: slideIn 0.3s ease-out; }
  .role-badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; }
  .barcode-input {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(30, 41, 59, 1) 100%);
    border: 2px solid rgba(212, 175, 55, 0.3);
  }
  .barcode-input:focus-within { border-color: #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
  .barcode-scanner { animation: scan 2s ease-in-out infinite; }
  @keyframes scan { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
  @keyframes checkmark { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .checkmark-anim { animation: checkmark 0.5s ease-out; }
  .shift-open { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
  .shift-closed { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
  .shift-active { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
  .barcode-label {
    width: 260px; height: 140px; background: white; color: black !important;
    padding: 8px; border: 1.5px solid #000; border-radius: 4px;
    display: inline-flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box; margin: 3px; vertical-align: top;
    page-break-inside: avoid; overflow: hidden;
  }
  .barcode-label * { color: black !important; }
  .barcode-label .bl-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #333; padding-bottom: 3px; font-size: 9px; }
  .barcode-label .bl-header .shop { font-weight: bold; font-size: 10px; }
  .barcode-label .bl-product { font-size: 12px; font-weight: bold; text-align: center; padding: 2px 0; line-height: 1.2; word-break: break-word; }
  .barcode-label .bl-price { background: #000; color: white !important; font-size: 14px; font-weight: bold; text-align: center; padding: 3px; border-radius: 3px; letter-spacing: 1px; }
  .barcode-label .bl-barcode { text-align: center; line-height: 0; }
  .barcode-label .bl-barcode svg { max-width: 100%; height: 35px !important; }
  .barcode-label .bl-code { font-size: 9px; text-align: center; font-family: 'Courier New', monospace; letter-spacing: 0.5px; margin-top: 1px; }
  .barcode-label.large { width: 320px; height: 170px; }
  .barcode-label.large .bl-product { font-size: 15px; }
  .barcode-label.large .bl-price { font-size: 18px; }
  .barcode-label.large .bl-barcode svg { height: 45px !important; }
  .barcode-label.large .bl-code { font-size: 11px; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; top: 0; right: 0; left: 0; width: 100%; background: white !important; padding: 10mm; margin: 0; }
    .no-print { display: none !important; }
    .barcode-label { margin: 2mm; }
    @page { size: A4; margin: 5mm; }
  }
  .receipt-paper { background: white; color: black; font-family: 'Cairo', sans-serif; max-width: 320px; margin: 0 auto; padding: 20px; border: 2px dashed #d4af37; }
  .receipt-paper * { color: black !important; }
  .receipt-header { text-align: center; border-bottom: 2px dashed #333; padding-bottom: 10px; margin-bottom: 10px; }
  .receipt-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .receipt-items { border-top: 1px dashed #333; border-bottom: 1px dashed #333; padding: 8px 0; margin: 8px 0; }
  .receipt-item { padding: 4px 0; font-size: 12px; }
  .receipt-total { font-size: 18px; font-weight: bold; text-align: center; padding: 8px 0; border-top: 2px dashed #333; margin-top: 8px; }
  .receipt-footer { text-align: center; font-size: 11px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; }
  .labels-preview { background: #f0f0f0; padding: 15px; border-radius: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-height: 500px; overflow-y: auto; }
  .film-card { transition: all 0.3s; }
  .film-card:hover { transform: translateY(-2px); border-color: #d4af37 !important; }
</style>

<!-- MAIN APP -->

<script>
// ============ STATE ============
let state = {
  users: [], products: [], customers: [], sales: [], activityLog: [],
  shifts: [], returns: [],
  filmTypes: [], // فلام الحماية
  settings: { name: 'صلاح الديب', address: 'نكلا - تحت الكوبري العالوي', phone: '', currency: 'ج.م', receiptMessage: 'شكراً لزيارتكم - نتمنى لكم قيادة آمنة' },
  barcodeCounter: 10000
};
let currentUser = null;
let saleItemsList = [];

const PERMISSIONS = {
  dashboard: { label: 'لوحة التحكم', icon: 'home' },
  storefront: { label: 'الواجهة الرئيسية', icon: 'store' },
  cashier: { label: 'نظام الكاشير', icon: 'cash' },
  shift: { label: 'جرد الشيفت', icon: 'shift' },
  products: { label: 'المنتجات', icon: 'box' },
  films: { label: 'فلام الحماية', icon: 'film' },
  barcodePrint: { label: 'طباعة الباركود', icon: 'barcode' },
  sales: { label: 'المبيعات', icon: 'cart' },
  returns: { label: 'الاسترجاعات', icon: 'return' },
  customers: { label: 'العملاء', icon: 'users' },
  inventory: { label: 'المخزون', icon: 'warehouse' },
  reports: { label: 'التقارير', icon: 'chart' },
  users: { label: 'إدارة المستخدمين', icon: 'shield' },
  activity: { label: 'سجل النشاطات', icon: 'history' },
  settings: { label: 'الإعدادات', icon: 'settings' }
};

const ROLE_PRESETS = {
  admin: { label: 'مدير النظام', color: 'bg-red-500/20 text-red-400', permissions: Object.keys(PERMISSIONS) },
  manager: { label: 'مدير', color: 'bg-amber-500/20 text-amber-400', permissions: ['dashboard','storefront','cashier','shift','products','films','sales','returns','customers','inventory','barcodePrint','reports','activity'] },
  cashier: { label: 'كاشير', color: 'bg-blue-500/20 text-blue-400', permissions: ['dashboard','storefront','cashier','shift','customers'] },
  stock: { label: 'أمين مخزن', color: 'bg-green-500/20 text-green-400', permissions: ['dashboard','storefront','products','inventory','barcodePrint'] }
};

// ============ BARCODE GEN ============
function generatePieceCode(baseBarcode, pieceIndex) { return `${baseBarcode}-${String(pieceIndex).padStart(3, '0')}`; }
function generateProductBarcode() { return '628' + Date.now().toString().slice(-10); }

// ============ STORAGE ============
function load() {
  const saved = localStorage.getItem('salahDeebShop_v7');
  if (saved) {
    state = JSON.parse(saved);
    if (!state.shifts) state.shifts = [];
    if (!state.returns) state.returns = [];
    if (!state.filmTypes) state.filmTypes = [];
    if (!state.barcodeCounter) state.barcodeCounter = 10000;
    state.products.forEach(p => {
      if (!p.pieceCodes) {
        p.pieceCodes = [];
        for (let i = 1; i <= p.qty; i++) p.pieceCodes.push(generatePieceCode(p.barcode, i));
        p.nextPieceIndex = p.qty + 1;
      }
    });
  } else {
    state.users = [{ id: 1, username: 'admin', password: 'admin', fullName: 'صلاح الديب', role: 'admin', permissions: Object.keys(PERMISSIONS), active: true, createdAt: new Date().toISOString(), createdBy: 'system' }];
    
    const baseProducts = [
      { name: 'زيت موبيل 10W-40', category: 'زيوت', cost: 180, price: 250, qty: 45, min: 10, image: '🛢️' },
      { name: 'زيت شل 5W-30', category: 'زيوت', cost: 220, price: 300, qty: 32, min: 10, image: '🛢️' },
      { name: 'فلتر زيت تويوتا', category: 'فلاتر', cost: 45, price: 75, qty: 60, min: 15, image: '🔧' },
      { name: 'فلتر هواء هيونداي', category: 'فلاتر', cost: 55, price: 90, qty: 38, min: 10, image: '🔧' },
      { name: 'فوسفور أمامي يسار', category: 'فوسفور', cost: 350, price: 500, qty: 8, min: 5, image: '💡' },
      { name: 'فوسفور خلفي يمين', category: 'فوسفور', cost: 280, price: 400, qty: 12, min: 5, image: '💡' },
      { name: 'مساحات زجاج', category: 'إكسسوارات', cost: 35, price: 60, qty: 50, min: 10, image: '🚗' },
      { name: 'معطر سيارة', category: 'إكسسوارات', cost: 25, price: 45, qty: 100, min: 20, image: '🌸' },
      { name: 'إطار ميشلان 205/55', category: 'إطارات', cost: 850, price: 1100, qty: 16, min: 8, image: '⚫' },
      { name: 'بطارية 60 أمبير', category: 'بطاريات', cost: 950, price: 1300, qty: 4, min: 5, image: '🔋' },
    ];
    state.products = baseProducts.map((p, idx) => {
      const barcode = '6281000000' + String(idx + 1).padStart(3, '0');
      const pieceCodes = [];
      for (let i = 1; i <= p.qty; i++) pieceCodes.push(generatePieceCode(barcode, i));
      return { ...p, id: idx + 1, barcode, pieceCodes, nextPieceIndex: p.qty + 1 };
    });
    
    state.customers = [
      { id: 1, name: 'أحمد محمد', phone: '01012345678', car: 'تويوتا كامري 2019', notes: 'عميل دائم', totalPurchases: 2500 },
      { id: 2, name: 'محمود علي', phone: '01198765432', car: 'هيونداي إلنترا 2020', notes: '', totalPurchases: 1800 },
      { id: 3, name: 'خالد إبراهيم', phone: '01255566778', car: 'كيا سيراتو 2021', notes: 'يفضل زيوت شل', totalPurchases: 3200 },
    ];
    
    // فلام الحماية - أنواع وأسعار
    state.filmTypes = [
      { id: 1, name: 'فلام شفاف عادي', type: 'شفاف', vehicle: 'سيارة', priceFront: 800, priceFull: 2500, description: 'فلام شفاف للحماية من الخدوش', warranty: '1 سنة' },
      { id: 2, name: 'فلام سيراميك شفاف', type: 'سيراميك', vehicle: 'سيارة', priceFront: 1500, priceFull: 4500, description: 'فلام سيراميك عالي الجودة', warranty: '3 سنوات' },
      { id: 3, name: 'فلام كربون', type: 'كربون', vehicle: 'سيارة', priceFront: 1200, priceFull: 3500, description: 'فلام كربون متين', warranty: '2 سنة' },
      { id: 4, name: 'فلام معتم (Dark)', type: 'معتم', vehicle: 'سيارة', priceFront: 600, priceFull: 2000, description: 'فلام معتم للخصوصية', warranty: '1 سنة' },
      { id: 5, name: 'فلام حماية PPF', type: 'PPF', vehicle: 'سيارة', priceFront: 3000, priceFull: 8000, description: 'فلام حماية طلاء متقدم', warranty: '5 سنوات' },
      { id: 6, name: 'فلام شفاف موتوسيكل', type: 'شفاف', vehicle: 'موتوسيكل', priceFront: 400, priceFull: 1200, description: 'فلام شفاف للدراجات النارية', warranty: '1 سنة' },
      { id: 7, name: 'فلام سيراميك موتوسيكل', type: 'سيراميك', vehicle: 'موتوسيكل', priceFront: 800, priceFull: 2200, description: 'فلام سيراميك للموتوسيكل', warranty: '2 سنة' },
      { id: 8, name: 'فلام معتم موتوسيكل', type: 'معتم', vehicle: 'موتوسيكل', priceFront: 350, priceFull: 1000, description: 'فلام معتم للموتوسيكل', warranty: '1 سنة' },
      { id: 9, name: 'فلام كشافات LED', type: 'كشافات', vehicle: 'سيارة', priceFront: 500, priceFull: 900, description: 'فلام حماية لكشافات السيارة', warranty: '1 سنة' },
      { id: 10, name: 'فلام كشافات موتوسيكل', type: 'كشافات', vehicle: 'موتوسيكل', priceFront: 250, priceFull: 450, description: 'فلام حماية لكشافات الموتوسيكل', warranty: '1 سنة' },
    ];
    
    const today = new Date();
    state.sales = [
      { id: 1001, cashierId: 1, cashierName: 'صلاح الديب', customerId: 1, customerName: 'أحمد محمد', date: new Date(today.getTime() - 86400000*2).toISOString(), items: [{productId:1, name:'زيت موبيل 10W-40', qty:2, price:250, pieceCodes:['6281000000001-001']}], subtotal: 575, discount: 0, total: 575, payment: 'نقدي', status: 'مكتملة' },
      { id: 1002, cashierId: 1, cashierName: 'صلاح الديب', customerId: 2, customerName: 'محمود علي', date: new Date(today.getTime() - 86400000).toISOString(), items: [{productId:2, name:'زيت شل 5W-30', qty:1, price:300, pieceCodes:['6281000000002-001']}], subtotal: 390, discount: 0, total: 390, payment: 'آجل', status: 'مكتملة' },
      { id: 1003, cashierId: 1, cashierName: 'صلاح الديب', customerId: 3, customerName: 'خالد إبراهيم', date: new Date().toISOString(), items: [{productId:5, name:'فوسفور أمامي يسار', qty:2, price:500, pieceCodes:['6281000000005-001']}], subtotal: 1000, discount: 0, total: 1000, payment: 'نقدي', status: 'مكتملة' },
    ];
    
    state.shifts = [];
    state.returns = [];
    save();
  }
}

function save() { localStorage.setItem('salahDeebShop_v7', JSON.stringify(state)); }

function logActivity(action, details = '') {
  state.activityLog.unshift({
    id: Date.now() + Math.random(),
    userId: currentUser.id, userName: currentUser.fullName, userRole: currentUser.role,
    action, details, timestamp: new Date().toISOString()
  });
  if (state.activityLog.length > 500) state.activityLog = state.activityLog.slice(0, 500);
  save();
}

// ============ SHIFT MANAGEMENT ============
function getCurrentShift() {
  return state.shifts.find(s => s.cashierId === currentUser.id && !s.closedAt);
}

function openShiftModal() {

function openShift() {

    id: Date.now(),
    cashierId: currentUser.id,

    closedAt: null,
    startAmount,
    notes,
    salesIds: [],
    returnsIds: [],
    totalSales: 0,
    totalReturns: 0,
    endAmount: 0,
    difference: 0
  };
  
  state.shifts.push(shift);
  logActivity('فتح شيفت', `شيفت جديد - مبلغ البداية: ${startAmount} ${state.settings.currency}`);
  save();
  closeModal();
  toast('تم فتح الشيفت بنجاح');
  updateShiftIndicator();
  showPage('cashier');

function updateShiftDiff(expected) {
  const actual = parseFloat(document.getElementById('shiftEndAmount').value) || 0;
  const diff = actual - expected;
  const display = document.getElementById('shiftDiffDisplay');
  if (diff === 0) {
    display.className = 'bg-green-500/10 border border-green-500/30 rounded-lg p-3 text-center';
    display.innerHTML = '<p class="text-sm text-green-400">✓ المبلغ مطابق</p>';
  } else if (diff > 0) {
    display.className = 'bg-blue-500/10 border border-blue-500/30 rounded-lg p-3 text-center';
    display.innerHTML = `<p class="text-sm text-blue-400">↑ زيادة: ${diff.toLocaleString()} ${state.settings.currency}</p>`;
  } else {
    display.className = 'bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-center';
    display.innerHTML = `<p class="text-sm text-red-400">↓ نقصان: ${Math.abs(diff).toLocaleString()} ${state.settings.currency}</p>`;
  }
}

function closeShift(expected) {
  const current = getCurrentShift();
  if (!current) return;
  
  const endAmount = parseFloat(document.getElementById('shiftEndAmount').value) || 0;
  const notes = document.getElementById('shiftCloseNotes').value.trim();
  
  current.closedAt = new Date().toISOString();
  current.endAmount = endAmount;
  current.difference = endAmount - expected;
  current.closeNotes = notes;
  
  logActivity('إغلاق شيفت', `الفرق: ${current.difference} ${state.settings.currency} - ${current.salesIds.length} فاتورة`);
  save();
  closeModal();
  toast('تم إغلاق الشيفت بنجاح');
  updateShiftIndicator();
  showShiftReport(current.id);
}

// ============ RETURNS ============
function openReturnModal(saleId) {
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  if (sale.status === 'مسترجعة') { toast('هذه الفاتورة مسترجعة بالفعل', true); return; }
  
  window._returningSale = sale;
  window._returnItems = sale.items.map(it => ({ ...it, selected: true, returnQty: it.qty }));
  
  renderReturnModal();
}

function renderReturnModal() {
  const sale = window._returningSale;
  const items = window._returnItems;
  
  const totalRefund = items.reduce((sum, it) => sum + (it.selected ? it.returnQty * it.price : 0), 0);
  
  showModal(`استرجاع فاتورة #${sale.id}`, `
    <div class="space-y-4">
      <div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-sm text-amber-300">

      <div class="bg-slate-800/50 rounded-lg p-3 text-sm space-y-1">
        <div class="flex justify-between"><span class="text-slate-400">العميل:</span><span class="text-white">${sale.customerName}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">التاريخ:</span><span class="text-white">${new Date(sale.date).toLocaleString('ar-EG')}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">الدفع:</span><span class="text-white">${sale.payment}</span></div>
      </div>
      
      <div>
        <label class="block text-sm text-slate-400 mb-2">نوع الاسترجاع</label>
        <select id="returnReason" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500">
          <option value="عيب في المنتج">عيب في المنتج</option>
          <option value="خطأ في الطلب">خطأ في الطلب</option>
          <option value="رغبة العميل">رغبة العميل</option>
          <option value="منتج غير مطابق">منتج غير مطابق</option>

        <label class="block text-sm text-slate-400 mb-2">اختر المنتجات المراد استرجاعها</label>
        <div class="space-y-2">
          ${items.map((it, i) => `
            <div class="bg-slate-800/50 rounded-lg p-3 ${it.selected ? 'border border-amber-500/50' : 'border border-slate-700 opacity-60'}">
              <div class="flex items-center gap-2 mb-2">
                <input type="checkbox" ${it.selected ? 'checked' : ''} onchange="toggleReturnItem(${i}, this.checked)" class="w-4 h-4 accent-amber-500">
                <span class="text-sm text-white flex-1">${it.name}</span>
                <span class="text-xs text-amber-400">${it.price} ${state.settings.currency}</span>
              </div>
              ${it.selected ? `
                <div class="flex items-center gap-2 mr-6">
                  <span class="text-xs text-slate-400">الكمية:</span>
                  <input type="number" min="1" max="${it.qty}" value="${it.returnQty}" onchange="updateReturnQty(${i}, this.value)" class="w-16 bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center">
                  <span class="text-xs text-slate-500">من ${it.qty}</span>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      </div>
      
      <div>
        <label class="block text-sm text-slate-400 mb-2">سبب الاسترجاع / ملاحظات</label>
        <textarea id="returnNotes" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500"></textarea>
      </div>
      
      <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex items-center justify-between">
        <span class="text-white font-semibold">المبلغ المسترد:</span>
        <span class="text-2xl font-bold text-red-400">${totalRefund.toLocaleString()} ${state.settings.currency}</span>
      </div>
      
      <button onclick="confirmReturn(${sale.id})" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg transition">تأكيد الاسترجاع</button>
    </div>
  `);
}

function toggleReturnItem(idx, checked) {
  window._returnItems[idx].selected = checked;
  if (checked) window._returnItems[idx].returnQty = window._returnItems[idx].qty;
  renderReturnModal();
}

function updateReturnQty(idx, value) {
  const max = window._returnItems[idx].qty;
  let qty = parseInt(value) || 1;
  if (qty < 1) qty = 1;
  if (qty > max) qty = max;
  window._returnItems[idx].returnQty = qty;
  renderReturnModal();
}

function confirmReturn(saleId) {
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  
  const items = window._returnItems.filter(it => it.selected && it.returnQty > 0);
  if (items.length === 0) { toast('الرجاء اختيار منتج واحد على الأقل', true); return; }
  
  const reason = document.getElementById('returnReason').value;
  const notes = document.getElementById('returnNotes').value.trim();
  const totalRefund = items.reduce((sum, it) => sum + (it.returnQty * it.price), 0);
  
  // Return items to stock
  items.forEach(it => {
    const p = state.products.find(x => x.id === it.productId);
    if (p) {
      p.qty += it.returnQty;
      // Add back piece codes
      if (!p.pieceCodes) p.pieceCodes = [];
      for (let i = 0; i < it.returnQty; i++) {
        const newCode = generatePieceCode(p.barcode, p.nextPieceIndex || (p.qty + 1));
        p.pieceCodes.push(newCode);
        p.nextPieceIndex = (p.nextPieceIndex || (p.qty + 1)) + 1;
      }
    }
  });
  
  // Check if full return
  const isFullReturn = items.every(it => it.returnQty === it.qty) && items.length === sale.items.length;
  
  // Update sale status
  if (isFullReturn) {
    sale.status = 'مسترجعة';
  } else {
    sale.status = 'مسترجعة جزئياً';
  }
  
  // Update customer purchases
  if (sale.customerId) {
    const customer = state.customers.find(c => c.id === sale.customerId);
    if (customer) customer.totalPurchases = Math.max(0, (customer.totalPurchases || 0) - totalRefund);
  }
  
  // Create return record
  const returnRecord = {
    id: Date.now(),
    saleId: sale.id,
    cashierId: currentUser.id,
    cashierName: currentUser.fullName,
    customerId: sale.customerId,
    customerName: sale.customerName,
    date: new Date().toISOString(),
    items: items.map(it => ({ productId: it.productId, name: it.name, qty: it.returnQty, price: it.price })),
    total: totalRefund,
    reason,
    notes,
    fullReturn: isFullReturn
  };
  
  state.returns.push(returnRecord);
  
  // Update current shift
  const current = getCurrentShift();
  if (current) {
    current.returnsIds.push(returnRecord.id);
  }
  
  logActivity('استرجاع فاتورة', `فاتورة #${sale.id} - ${totalRefund.toLocaleString()} ${state.settings.currency} - ${reason}`);
  save();
  
  closeModal();
  delete window._returningSale;
  delete window._returnItems;
  
  toast('تم الاسترجاع بنجاح');
  showReturnReceipt(returnRecord.id);
}

// ============ AUTH ============
function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const user = state.users.find(x => x.username === u && x.password === p && x.active);
  if (!user) {
    const err = document.getElementById('loginError');
    err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    err.classList.remove('hidden');
    return;
  }
  currentUser = user;
  logActivity('تسجيل دخول', `دخول المستخدم ${user.fullName}`);
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  initApp();
}

function logout() {
  if (!confirm('هل تريد تسجيل الخروج؟')) return;
  logActivity('تسجيل خروج', `خروج المستخدم ${currentUser.fullName}`);
  currentUser = null;
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').classList.add('hidden');
}

function hasPermission(perm) { return currentUser && currentUser.permissions && currentUser.permissions.includes(perm); }

function initApp() {
  document.getElementById('userName').textContent = currentUser.fullName;
  document.getElementById('userRole').textContent = ROLE_PRESETS[currentUser.role]?.label || currentUser.role;
  document.getElementById('userAvatar').textContent = currentUser.fullName.charAt(0);

}

function handleBarcodeScan(event) {
  if (event.key === 'Enter') {
    const barcode = document.getElementById('barcodeInput').value.trim();
    if (!barcode) return;
    let product = null, pieceCode = null;
    for (const p of state.products) {
      if (p.pieceCodes && p.pieceCodes.includes(barcode)) { product = p; pieceCode = barcode; break; }
    }
    if (!product) {
      product = state.products.find(p => p.barcode === barcode);
      if (product && product.pieceCodes && product.pieceCodes.length > 0) pieceCode = product.pieceCodes[0];
    }
    if (product) {
      addToCart(product.id, pieceCode);
      document.getElementById('barcodeInput').value = '';
      toast(`تمت إضافة: ${product.name}`);
    } else toast('الباركود غير موجود', true);
  }
}

function renderCashierProducts() {
  const search = (document.getElementById('cashierSearch')?.value || '').toLowerCase();
  const cat = document.getElementById('cashierCategory')?.value || '';
  let products = state.products.filter(p => p.qty > 0);
  if (cat) products = products.filter(p => p.category === cat);
  if (search) products = products.filter(p => p.name.toLowerCase().includes(search));
  document.getElementById('cashierProducts').innerHTML = products.length ? products.map(p => `
    <div onclick="addToCart(${p.id})" class="cashier-item cursor-pointer card-gradient border border-slate-700 rounded-xl p-3 hover:border-amber-500">
      <div class="text-4xl text-center mb-2">${p.image || '📦'}</div>
      <h4 class="text-sm font-bold text-white line-clamp-1">${p.name}</h4>
      <div class="flex items-center justify-between mt-2">
        <span class="text-amber-400 font-bold text-sm">${p.price} ${state.settings.currency}</span>
        <span class="text-xs text-slate-500">${p.qty}</span>
      </div>
    </div>
  `).join('') : '<p class="text-slate-500 text-center py-10 col-span-full">لا توجد منتجات</p>';
}

function addToCart(productId, pieceCode = null) {
  const p = state.products.find(x => x.id === productId);
  if (!p) return;
  const existing = saleItemsList.find(it => it.productId === productId);
  if (existing) {
    if (existing.qty >= p.qty) { toast('الكمية غير كافية', true); return; }
    existing.qty++;
    if (p.pieceCodes && p.pieceCodes.length > existing.qty - 1) existing.pieceCodes.push(p.pieceCodes[existing.qty - 1]);
  } else {
    const firstPiece = pieceCode || (p.pieceCodes && p.pieceCodes.length > 0 ? p.pieceCodes[0] : null);
    saleItemsList.push({ productId, name: p.name, price: p.price, qty: 1, maxQty: p.qty, pieceCodes: firstPiece ? [firstPiece] : [] });
  }
  renderCart();
}

function updateCartQty(idx, newQty) {
  newQty = parseInt(newQty) || 1;
  if (newQty < 1) newQty = 1;
  if (newQty > saleItemsList[idx].maxQty) { toast('الكمية غير كافية', true); newQty = saleItemsList[idx].maxQty; }
  saleItemsList[idx].qty = newQty;
  const p = state.products.find(x => x.id === saleItemsList[idx].productId);
  if (p && p.pieceCodes) saleItemsList[idx].pieceCodes = p.pieceCodes.slice(0, newQty);
  renderCart();
}

function removeFromCart(idx) { saleItemsList.splice(idx, 1); renderCart(); }
function clearCart() { saleItemsList = []; const d = document.getElementById('cartDiscount'); if (d) d.value = 0; renderCart(); }

function renderCart() {
  const container = document.getElementById('cartItems');
  if (!container) return;
  container.innerHTML = saleItemsList.length ? saleItemsList.map((it, i) => `
    <div class="bg-slate-800/50 rounded-lg p-3 flex items-center gap-2">
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-white truncate">${it.name}</p>
        <p class="text-xs text-slate-400">${it.price} × ${it.qty} = ${(it.price * it.qty).toLocaleString()}</p>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="updateCartQty(${i}, ${it.qty - 1})" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded text-white">-</button>
        <input type="number" value="${it.qty}" min="1" onchange="updateCartQty(${i}, this.value)" class="w-12 bg-slate-700 border border-slate-600 rounded px-1 py-0.5 text-center text-sm">
        <button onclick="updateCartQty(${i}, ${it.qty + 1})" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded text-white">+</button>
        <button onclick="removeFromCart(${i})" class="w-6 h-6 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded mr-1">×</button>
      </div>
    </div>
  `).join('') : '<p class="text-slate-500 text-center py-8 text-sm">السلة فارغة<br>امسح الباركود أو اضغط على منتج</p>';
  updateCartTotal();
}

function updateCartTotal() {
  const subtotal = saleItemsList.reduce((s, it) => s + (it.price * it.qty), 0);
  const discount = parseFloat(document.getElementById('cartDiscount')?.value || 0);
  const total = Math.max(0, subtotal - discount);
  const sub = document.getElementById('cartSubtotal');
  const tot = document.getElementById('cartTotal');
  if (sub) sub.textContent = subtotal.toLocaleString() + ' ' + state.settings.currency;
  if (tot) tot.textContent = total.toLocaleString() + ' ' + state.settings.currency;
}

function completeSale() {
  if (saleItemsList.length === 0) { toast('السلة فارغة', true); return; }
  
  const currentShift = getCurrentShift();
  if (hasPermission('shift') && !currentShift) {
    toast('يجب فتح شيفت أولاً', true);
    return;
  }
  
  const customerId = document.getElementById('cashierCustomer').value;
  const customer = state.customers.find(c => c.id == customerId);
  const discount = parseFloat(document.getElementById('cartDiscount').value) || 0;
  const subtotal = saleItemsList.reduce((s, it) => s + (it.price * it.qty), 0);
  const total = Math.max(0, subtotal - discount);
  
  saleItemsList.forEach(it => {
    const p = state.products.find(x => x.id === it.productId);
    if (p) {
      p.qty -= it.qty;
      if (it.pieceCodes && it.pieceCodes.length > 0 && p.pieceCodes) {
        it.pieceCodes.forEach(pc => {
          const idx = p.pieceCodes.indexOf(pc);
          if (idx > -1) p.pieceCodes.splice(idx, 1);
        });
      }
    }
  });
  
  const sale = {
    id: 1000 + state.sales.length + 1,
    cashierId: currentUser.id, cashierName: currentUser.fullName,
    customerId: customer ? customer.id : null, customerName: customer ? customer.name : 'عميل نقدي',
    date: new Date().toISOString(),
    items: saleItemsList.map(it => ({ productId: it.productId, name: it.name, qty: it.qty, price: it.price, pieceCodes: it.pieceCodes || [] })),
    subtotal, discount, total,
    payment: document.getElementById('cartPayment').value,
    status: 'مكتملة'
  };
  
  state.sales.push(sale);
  if (customer) customer.totalPurchases = (customer.totalPurchases || 0) + total;
  
  // Update shift
  if (currentShift) {
    currentShift.salesIds.push(sale.id);
    currentShift.totalSales += total;
  }
  
  logActivity('عملية بيع', `فاتورة #${sale.id} بقيمة ${total.toLocaleString()} ${state.settings.currency}`);
  save();
  updateShiftIndicator();
  showSaleCompleteDialog(sale);
}

        </div>
        <h3 class="text-2xl font-bold text-white mb-2">تمت عملية البيع بنجاح!</h3>

      </div>
      <div class="bg-slate-800/50 rounded-xl p-4 mb-5 space-y-2">
        <div class="flex justify-between text-sm"><span class="text-slate-400">العميل:</span><span class="text-white">${sale.customerName}</span></div>
        <div class="flex justify-between text-sm"><span class="text-slate-400">عدد المنتجات:</span><span class="text-white">${sale.items.length}</span></div>

      </div>
      <div class="mb-4">
        <p class="text-center text-slate-300 mb-3 font-semibold">هل تريد طباعة الفاتورة؟</p>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="printSaleReceipt(${sale.id})" class="gold-gradient text-slate-900 font-bold py-3 rounded-lg hover:opacity-90 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            طباعة
          </button>
          <button onclick="closeSaleDialog()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition">إغلاق</button>
        </div>
      </div>
      <button onclick="viewSaleReceipt(${sale.id})" class="w-full text-amber-400 hover:text-amber-300 text-sm py-2 transition">عرض الفاتورة</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function closeSaleDialog() {
  const m = document.getElementById('saleCompleteModal');
  if (m) m.remove();
  saleItemsList = [];
  renderCashier();
}

// ============ RECEIPT ============
function buildReceiptHTML(sale) {
  const itemsHtml = sale.items.map(it => {
    const piecesHtml = it.pieceCodes && it.pieceCodes.length > 0 ? `<div style="font-size:10px; color:#666; margin-top:2px;">أكواد: ${it.pieceCodes.join(', ')}</div>` : '';
    return `<div class="receipt-item"><div style="display:flex; justify-content:space-between;"><span>${it.name}</span><span>${(it.qty * it.price).toLocaleString()}</span></div><div style="display:flex; justify-content:space-between; font-size:11px; color:#666;"><span>${it.qty} × ${it.price.toLocaleString()}</span></div>${piecesHtml}</div>`;
  }).join('');

function viewSaleReceipt(saleId) {
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const dialog = document.getElementById('saleCompleteModal');
  if (dialog) dialog.remove();
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `<div class="bg-slate-800 border border-amber-500/30 rounded-2xl p-4 w-full max-w-md max-h-[90vh] overflow-y-auto scrollbar-thin slide-in"><div class="flex items-center justify-between mb-3"><h3 class="text-lg font-bold text-white">معاينة الفاتورة</h3><button onclick="this.closest('.fixed').remove()" class="text-slate-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div><div>${buildReceiptHTML(sale)}</div><div class="flex gap-2 mt-4"><button onclick="printSaleReceipt(${sale.id})" class="flex-1 gold-gradient text-slate-900 font-bold py-2 rounded-lg hover:opacity-90 transition">طباعة</button><button onclick="this.closest('.fixed').remove()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg transition">إغلاق</button></div></div>`;
  document.body.appendChild(modal);
}

function printSaleReceipt(saleId) {
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const dialog = document.getElementById('saleCompleteModal');
  if (dialog) dialog.remove();
  document.querySelectorAll('.fixed').forEach(m => { if (m.id !== 'toast') m.remove(); });
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = buildReceiptHTML(sale);
  printArea.classList.remove('hidden');
  logActivity('طباعة فاتورة', `فاتورة #${sale.id}`);
  save();
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      printArea.classList.add('hidden');
      printArea.innerHTML = '';
      saleItemsList = [];
      renderCashier();
    }, 500);
  }, 100);
}

function editFilm(id) {
  const f = state.filmTypes.find(x => x.id === id);
  if (!f) return;
  editingFilmId = id;
  openFilmModal();
  setTimeout(() => {
    document.getElementById('f-name').value = f.name;
    document.getElementById('f-type').value = f.type;
    document.getElementById('f-vehicle').value = f.vehicle;
    document.getElementById('f-priceFront').value = f.priceFront;
    document.getElementById('f-priceFull').value = f.priceFull;
    document.getElementById('f-warranty').value = f.warranty;
    document.getElementById('f-description').value = f.description;
    document.querySelector('#modalContainer h3').textContent = 'تعديل نوع الفلام';
  }, 50);
}

function saveFilm() {
  const name = document.getElementById('f-name').value.trim();
  const type = document.getElementById('f-type').value;
  const vehicle = document.getElementById('f-vehicle').value;
  const priceFront = parseFloat(document.getElementById('f-priceFront').value) || 0;
  const priceFull = parseFloat(document.getElementById('f-priceFull').value) || 0;
  const warranty = document.getElementById('f-warranty').value.trim();
  const description = document.getElementById('f-description').value.trim();
  
  if (!name || priceFront <= 0) { toast('الرجاء إدخال البيانات المطلوبة', true); return; }
  
  if (editingFilmId) {
    const f = state.filmTypes.find(x => x.id === editingFilmId);
    Object.assign(f, { name, type, vehicle, priceFront, priceFull, warranty, description });
    logActivity('تعديل فلام', `تم تعديل: ${name}`);
  } else {
    state.filmTypes.push({ id: Date.now(), name, type, vehicle, priceFront, priceFull, warranty, description });
    logActivity('إضافة فلام', `تم إضافة: ${name}`);
  }
  save();
  closeModal();
  renderFilmsGrid();
  toast('تم حفظ الفلام بنجاح');
}

function deleteFilm(id) {
  if (!confirm('هل أنت متأكد من حذف هذا النوع؟')) return;
  const f = state.filmTypes.find(x => x.id === id);
  state.filmTypes = state.filmTypes.filter(x => x.id !== id);
  logActivity('حذف فلام', `تم حذف: ${f?.name || id}`);
  save();
  renderFilmsGrid();
  toast('تم حذف الفلام');
}

function editProduct(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  editingProductId = id;
  openProductModal();
  setTimeout(() => {
    document.getElementById('p-name').value = p.name;
    document.getElementById('p-category').value = p.category;
    document.getElementById('p-image').value = p.image || '📦';
    document.getElementById('p-qty').value = p.qty;
    document.getElementById('p-cost').value = p.cost;
    document.getElementById('p-price').value = p.price;
    document.getElementById('p-min').value = p.min;
    document.querySelector('#modalContainer h3').textContent = 'تعديل المنتج';
  }, 50);
}

function saveProduct() {
  const name = document.getElementById('p-name').value.trim();
  const qty = parseInt(document.getElementById('p-qty').value) || 0;
  const cost = parseFloat(document.getElementById('p-cost').value) || 0;
  const price = parseFloat(document.getElementById('p-price').value) || 0;
  const min = parseInt(document.getElementById('p-min').value) || 5;
  const category = document.getElementById('p-category').value;
  const image = document.getElementById('p-image').value;
  if (!name || price <= 0) { toast('الرجاء إدخال البيانات المطلوبة', true); return; }
  if (qty < 1) { toast('الرجاء إدخال كمية صحيحة', true); return; }
  
  if (editingProductId) {
    const p = state.products.find(x => x.id === editingProductId);
    const oldQty = p.qty;
    Object.assign(p, { name, category, image, cost, price, min });
    if (qty > oldQty) {
      for (let i = oldQty + 1; i <= qty; i++) {
        if (!p.pieceCodes) p.pieceCodes = [];
        p.pieceCodes.push(generatePieceCode(p.barcode, p.nextPieceIndex || i));
        p.nextPieceIndex = (p.nextPieceIndex || i) + 1;
      }
    } else if (qty < oldQty) {
      if (p.pieceCodes) p.pieceCodes = p.pieceCodes.slice(0, qty);
    }
    p.qty = qty;
    logActivity('تعديل منتج', `تم تعديل: ${name}`);
  } else {
    const barcode = generateProductBarcode();
    const pieceCodes = [];
    for (let i = 1; i <= qty; i++) pieceCodes.push(generatePieceCode(barcode, i));
    state.products.push({ id: Date.now(), name, barcode, category, image, qty, cost, price, min, pieceCodes, nextPieceIndex: qty + 1 });
    logActivity('إضافة منتج', `تم إضافة: ${name} (${qty} قطعة)`);
  }
  save();
  closeModal();
  renderProductsTable();
  toast('تم حفظ المنتج بنجاح');
}

function deleteProduct(id) {
  if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
  const p = state.products.find(x => x.id === id);
  state.products = state.products.filter(x => x.id !== id);
  logActivity('حذف منتج', `تم حذف: ${p?.name || id}`);
  save();
  renderProductsTable();
  toast('تم حذف المنتج');
}

                <td class="px-4 py-3">${p.qty <= p.min ? '<span class="text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded-full">⚠ منخفض</span>' : '<span class="text-xs bg-green-500/20 text-green-400 px-2 py-1 rounded-full">✓ جيد</span>'}</td>
                <td class="px-4 py-3"><button onclick="restock(${p.id})" class="text-xs bg-amber-500/20 text-amber-400 px-3 py-1.5 rounded-lg hover:bg-amber-500/30 transition">+ إضافة كمية</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function restock(id) {
  const qty = prompt('أدخل الكمية المراد إضافتها:');
  if (!qty || isNaN(qty) || parseInt(qty) < 1) return;
  const p = state.products.find(x => x.id === id);
  if (p) {
    const addQty = parseInt(qty);
    const startIdx = (p.nextPieceIndex || p.qty + 1);
    if (!p.pieceCodes) p.pieceCodes = [];
    for (let i = 0; i < addQty; i++) {
      p.pieceCodes.push(generatePieceCode(p.barcode, startIdx + i));
    }
    p.nextPieceIndex = startIdx + addQty;
    p.qty += addQty;
    logActivity('إعادة تعبئة', `تمت إضافة ${addQty} إلى ${p.name}`);
    save();
    renderInventory();
    toast(`تمت إضافة ${addQty} قطعة`);
  }
}

// ============ REPORTS ============
function renderReports() {
  const today = new Date();
  const todayStr = today.toDateString();
  const thisMonth = today.getMonth();
  const thisYear = today.getFullYear();
  const activeSales = state.sales.filter(s => s.status !== 'مسترجعة');
  const todaySales = activeSales.filter(s => new Date(s.date).toDateString() === todayStr);
  const monthSales = activeSales.filter(s => { const d = new Date(s.date); return d.getMonth() === thisMonth && d.getFullYear() === thisYear; });
  const todayTotal = todaySales.reduce((s, x) => s + x.total, 0);
  const monthTotal = monthSales.reduce((s, x) => s + x.total, 0);
  const allTotal = activeSales.reduce((s, x) => s + x.total, 0);
  const allCost = activeSales.reduce((s, sale) => s + sale.items.reduce((ss, it) => {
    const p = state.products.find(pp => pp.id === it.productId);
    return ss + (p ? p.cost * it.qty : 0);
  }, 0), 0);
  const profit = allTotal - allCost;
  const totalReturns = state.returns.reduce((s, r) => s + r.total, 0);
  
  const cashierMap = {};
  activeSales.forEach(s => {
    if (!cashierMap[s.cashierName]) cashierMap[s.cashierName] = { count: 0, total: 0 };
    cashierMap[s.cashierName].count++;
    cashierMap[s.cashierName].total += s.total;
  });
  
  document.getElementById('pageContainer').innerHTML = `
    <div class="fade-in">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div class="card-gradient border border-slate-700 rounded-2xl p-5">
          <h3 class="text-lg font-bold text-white mb-4">ملخص المبيعات</h3>
          <div class="space-y-3">
            <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-300">مبيعات اليوم</span><span class="font-bold text-white">${todayTotal.toLocaleString()} ${state.settings.currency}</span></div>
            <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-300">مبيعات الشهر</span><span class="font-bold text-white">${monthTotal.toLocaleString()} ${state.settings.currency}</span></div>
            <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-300">إجمالي المبيعات</span><span class="font-bold text-amber-400">${allTotal.toLocaleString()} ${state.settings.currency}</span></div>
            <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-300">صافي الربح</span><span class="font-bold text-green-400">${profit.toLocaleString()} ${state.settings.currency}</span></div>
            <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-300">إجمالي الاسترجاعات</span><span class="font-bold text-red-400">${totalReturns.toLocaleString()} ${state.settings.currency}</span></div>
          </div>
        </div>
        <div class="card-gradient border border-slate-700 rounded-2xl p-5">
          <h3 class="text-lg font-bold text-white mb-4">أداء الكاشير</h3>
          <div class="space-y-3">
            ${Object.entries(cashierMap).map(([name, data]) => `
              <div class="p-3 bg-slate-800/50 rounded-lg">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-white font-semibold">${name}</span>
                  <span class="text-amber-400 font-bold">${data.total.toLocaleString()} ${state.settings.currency}</span>
                </div>
                <p class="text-xs text-slate-400">${data.count} فاتورة</p>
              </div>
            `).join('') || '<p class="text-slate-500 text-sm text-center py-4">لا توجد بيانات</p>'}
          </div>
        </div>
      </div>
    </div>
  `;
}

function applyRolePreset() {
  const role = document.getElementById('u-role').value;
  if (!role) return;
  const perms = ROLE_PRESETS[role].permissions;
  document.querySelectorAll('.user-perm').forEach(cb => { cb.checked = perms.includes(cb.value); });
}

function editUser(id) {
  const u = state.users.find(x => x.id === id);
  if (!u) return;
  editingUserId = id;
  openUserModal();
  setTimeout(() => {
    document.getElementById('u-fullname').value = u.fullName;
    document.getElementById('u-username').value = u.username;
    document.getElementById('u-password').value = u.password;
    document.getElementById('u-active').checked = u.active;
    document.querySelectorAll('.user-perm').forEach(cb => { cb.checked = u.permissions.includes(cb.value); });
    document.querySelector('#modalContainer h3').textContent = 'تعديل مستخدم';
  }, 50);
}

function saveUser() {
  const fullName = document.getElementById('u-fullname').value.trim();
  const username = document.getElementById('u-username').value.trim();
  const password = document.getElementById('u-password').value;
  const active = document.getElementById('u-active').checked;
  const permissions = Array.from(document.querySelectorAll('.user-perm:checked')).map(cb => cb.value);
  if (!fullName || !username || !password) { toast('الرجاء إدخال جميع البيانات', true); return; }
  if (permissions.length === 0) { toast('الرجاء تحديد صلاحية واحدة على الأقل', true); return; }
  const existing = state.users.find(u => u.username === username && u.id !== editingUserId);
  if (existing) { toast('اسم المستخدم موجود بالفعل', true); return; }
  if (editingUserId) {
    const u = state.users.find(x => x.id === editingUserId);
    Object.assign(u, { fullName, username, password, active, permissions });
  } else {
    state.users.push({ id: Date.now(), fullName, username, password, active, permissions, role: 'custom', createdAt: new Date().toISOString(), createdBy: currentUser.fullName });
  }
  save();
  closeModal();
  renderUsers();
  toast('تم حفظ المستخدم بنجاح');
}

function deleteUser(id) {
  if (id === currentUser.id) { toast('لا يمكنك حذف حسابك', true); return; }
  if (!confirm('هل أنت متأكد؟')) return;
  state.users = state.users.filter(x => x.id !== id);
  save();
  renderUsers();
  toast('تم حذف المستخدم');
}

      </div>
      <div class="card-gradient border border-slate-700 rounded-2xl p-5 mb-6">
        <h3 class="text-lg font-bold text-white mb-4">اختيار المنتجات</h3>
        <div class="space-y-3 max-h-[500px] overflow-y-auto scrollbar-thin" id="barcodeProductsList"></div>
      </div>
      <div class="card-gradient border border-amber-500/30 rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
          <h3 class="text-lg font-bold text-white">معاينة</h3>
          <div class="flex gap-2">
            <button onclick="generatePreview()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm transition">تحديث</button>
            <button onclick="printSelectedBarcodes()" class="gold-gradient text-slate-900 font-bold px-6 py-2 rounded-lg hover:opacity-90 transition">طباعة</button>
          </div>
        </div>
        <div id="labelsPreviewContainer" class="labels-preview"><p class="text-slate-500 text-sm py-10">اضغط "تحديث المعاينة"</p></div>
      </div>
    </div>
  `;
  renderBarcodeProductsList();
  updateSelectedCount();
}

function renderBarcodeProductsList() {
  const list = document.getElementById('barcodeProductsList');
  list.innerHTML = state.products.map(p => {
    const piecesCount = p.pieceCodes?.length || 0;
    const sel = barcodePrintState.selectedProducts[p.id];
    return `
      <label class="flex items-center gap-3 p-3 bg-slate-800/50 rounded-lg cursor-pointer hover:bg-slate-800 transition">
        <input type="checkbox" class="barcode-product-check w-5 h-5 accent-amber-500" value="${p.id}" ${sel.all ? 'checked' : ''} onchange="toggleProductSelection(${p.id}, this.checked)">
        <span class="text-2xl">${p.image || '📦'}</span>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-white truncate">${p.name}</p>
          <div class="flex items-center gap-2 mt-1 flex-wrap">
            <span class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full">${p.category}</span>
            <span class="text-xs text-green-400">${piecesCount} قطعة</span>
            <span class="text-xs text-amber-400 font-bold">${p.price.toLocaleString()} ${state.settings.currency}</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-400">نسخ:</label>
          <input type="number" min="1" max="20" value="${sel.copies}" data-product="${p.id}" class="product-copies w-16 bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-center" onchange="updateProductCopies(${p.id}, this.value)">
        </div>
      </label>
    `;
  }).join('');
}

function toggleProductSelection(productId, checked) {
  barcodePrintState.selectedProducts[productId].all = checked;
  updateSelectedCount();
}

function updateProductCopies(productId, value) {
  barcodePrintState.selectedProducts[productId].copies = Math.max(1, parseInt(value) || 1);
  updateSelectedCount();
}

function applyGlobalCopies(value) {
  const copies = Math.max(1, parseInt(value) || 1);
  Object.keys(barcodePrintState.selectedProducts).forEach(pid => {
    barcodePrintState.selectedProducts[pid].copies = copies;
    const input = document.querySelector(`.product-copies[data-product="${pid}"]`);
    if (input) input.value = copies;
  });
  updateSelectedCount();
}

function selectAllProducts() {
  Object.keys(barcodePrintState.selectedProducts).forEach(pid => { barcodePrintState.selectedProducts[pid].all = true; });
  document.querySelectorAll('.barcode-product-check').forEach(cb => cb.checked = true);
  updateSelectedCount();
}

function deselectAllProducts() {
  Object.keys(barcodePrintState.selectedProducts).forEach(pid => { barcodePrintState.selectedProducts[pid].all = false; });
  document.querySelectorAll('.barcode-product-check').forEach(cb => cb.checked = false);
  updateSelectedCount();
}

function updateSelectedCount() {
  let total = 0;
  state.products.forEach(p => {
    const sel = barcodePrintState.selectedProducts[p.id];
    if (!sel || !sel.all) return;
    total += (p.pieceCodes?.length || 0) * sel.copies;
  });
  const el = document.getElementById('selectedLabelsCount');
  if (el) el.textContent = total.toLocaleString();
}

function generatePreview() {
  const previewItems = [];
  state.products.forEach(p => {
    const sel = barcodePrintState.selectedProducts[p.id];
    if (!sel || !sel.all || !p.pieceCodes || p.pieceCodes.length === 0) return;
    p.pieceCodes.forEach(pieceCode => {
      for (let c = 0; c < sel.copies; c++) previewItems.push({ product: p, pieceCode });
    });
  });
  const container = document.getElementById('labelsPreviewContainer');
  if (previewItems.length === 0) { container.innerHTML = '<p class="text-slate-500 text-sm py-10">لم يتم اختيار أي ملصقات</p>'; return; }
  const sizeClass = barcodePrintState.labelSize === 'large' ? 'large' : '';
  container.innerHTML = previewItems.slice(0, 50).map((item, idx) => buildBarcodeLabelHTML(item.product, item.pieceCode, sizeClass, idx)).join('') + (previewItems.length > 50 ? `<p class="w-full text-center text-amber-400 py-3">... و ${previewItems.length - 50} ملصق آخر</p>` : '');
  setTimeout(() => renderAllBarcodes(), 100);
}

function buildBarcodeLabelHTML(product, pieceCode, sizeClass = '', uniqueId = '') {
  const labelId = 'bc_' + uniqueId + '_' + Math.random().toString(36).substr(2, 8);
  return `<div class="barcode-label ${sizeClass}" data-code="${pieceCode}"><div class="bl-header"><span class="shop">${state.settings.name}</span><span>${product.category}</span></div><div class="bl-product">${product.name}</div><div class="bl-price">${product.price.toLocaleString()} ${state.settings.currency}</div><div class="bl-barcode"><svg id="${labelId}"></svg></div><div class="bl-code">${pieceCode}</div></div>`;
}

function renderAllBarcodes() {
  document.querySelectorAll('.barcode-label').forEach(label => {
    const svg = label.querySelector('svg');
    const code = label.dataset.code;
    if (!svg || !code || svg.dataset.rendered) return;
    try {
      JsBarcode(svg, code, { format: "CODE128", width: 1.5, height: 35, displayValue: false, margin: 0, background: "#ffffff" });
      svg.dataset.rendered = 'true';
    } catch (e) { console.error('Barcode error:', e); }
  });
}

function printSelectedBarcodes() {
  const previewItems = [];
  state.products.forEach(p => {
    const sel = barcodePrintState.selectedProducts[p.id];
    if (!sel || !sel.all || !p.pieceCodes || p.pieceCodes.length === 0) return;
    p.pieceCodes.forEach(pieceCode => {
      for (let c = 0; c < sel.copies; c++) previewItems.push({ product: p, pieceCode });
    });
  });
  if (previewItems.length === 0) { toast('الرجاء اختيار منتج', true); return; }
  const sizeClass = barcodePrintState.labelSize === 'large' ? 'large' : '';
  const labelsHtml = previewItems.map((item, idx) => buildBarcodeLabelHTML(item.product, item.pieceCode, sizeClass, idx)).join('');
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = `<div style="display:flex; flex-wrap:wrap; justify-content:center; gap:3mm;">${labelsHtml}</div>`;
  printArea.classList.remove('hidden');
  logActivity('طباعة باركود', `تم طباعة ${previewItems.length} ملصق`);
  save();
  setTimeout(() => {
    renderAllBarcodes();
    setTimeout(() => {
      window.print();
      setTimeout(() => { printArea.classList.add('hidden'); printArea.innerHTML = ''; }, 500);
    }, 400);
  }, 100);
}

// ============ MODAL HELPERS ============
function showModal(title, content) {
  const modal = document.createElement('div');
  modal.id = 'activeModal';
  modal.className = 'fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4';
  modal.onclick = (e) => { if (e.target === modal) closeModal(); };
  modal.innerHTML = `<div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto scrollbar-thin slide-in"><div class="flex items-center justify-between mb-5"><h3 class="text-xl font-bold text-white">${title}</h3><button onclick="closeModal()" class="text-slate-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div>${content}</div>`;
  document.getElementById('modalContainer').innerHTML = '';
  document.getElementById('modalContainer').appendChild(modal);
}

function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

// ============ UTILS ============
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.className = `fixed bottom-6 left-6 ${isError ? 'bg-red-500' : 'bg-green-500'} text-white px-5 py-3 rounded-lg shadow-lg z-[100] flex items-center gap-2`;
  document.getElementById('toastMsg').textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

function updateClock() {
  const now = new Date();
  document.getElementById('currentDate').textContent = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('currentTime').textContent = now.toLocaleTimeString('ar-EG');
}

// Init
load();
updateClock();
setInterval(updateClock, 1000);
document.getElementById('loginPass').addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
